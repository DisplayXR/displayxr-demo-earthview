name: Build Android

# Android (NDK) APK build for the EarthView demo (M3). Mirrors build-macos.yml's
# structure: a DetectChanges/docs_only gate, validation-only on PR + push-to-main,
# and a release-attach step gated on a v* tag.
#
# The Android leg (android/) is a standalone Gradle project — a vendor-neutral
# OOP OpenXR client (Vulkan, NativeActivity; ADR-025). It compiles the shared
# tiles_common/ renderer + cesium-native streaming engine cross-built for
# arm64-android via ezvcpkg.
#
# Version-bump dispatch lives in build-macos.yml (the sole earthview_demo
# bumper) — this workflow intentionally does NOT dispatch a second bump.
#
# ── CMake 3.31.6 decision (the main gotcha) ──────────────────────────────────
# android/build.gradle pins `cmake { version "3.31.6" }` because tiles_common +
# cesium-native require CMake >= 3.25, but the Android SDK's sdkmanager only
# offers cmake;3.22.1. Locally David points AGP at Homebrew's 3.31.6 via
# local.properties (cmake.dir=/opt/homebrew). We do NOT relax the pin (3.22.1 is
# too old for cesium, and matching dev's exact 3.31.6 avoids version drift).
# Instead CI installs the official Kitware 3.31.6 Linux tarball, drops a `ninja`
# (from apt) alongside it — AGP requires `ninja` next to `cmake` in cmake.dir/bin
# — and points AGP at it through a generated local.properties.

on:
  pull_request: {}
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  DetectChanges:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
          else
            BASE=${{ github.event.before }}
          fi
          # First push to a new repo/branch: before is all-zeros (no parent) →
          # there's nothing to diff, so build (not docs-only).
          if [ "$BASE" = "0000000000000000000000000000000000000000" ] || \
             ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          NON_DOC=$(echo "$CHANGED" | grep -vE '^(docs/|.*\.md$|LICENSE$|\.github/ISSUE_TEMPLATE/)' || true)
          if [ -n "$CHANGED" ] && [ -z "$NON_DOC" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  BuildAPK:
    name: Build Android
    needs: DetectChanges
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: the APK version stamps come from
          # `git describe --tags` (#60). A shallow or tagless checkout makes
          # describe fail and the build errors out rather than guessing.
          fetch-depth: 0
          fetch-tags: true

      - name: Doc-only PR — skipping heavy build steps
        if: needs.DetectChanges.outputs.docs_only == 'true'
        run: echo "docs_only=true; build steps will skip and report success."

      - name: Set up JDK 17 (temurin)
        if: needs.DetectChanges.outputs.docs_only != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # cesium-native is consumed via add_subdirectory(third_party/cesium-native)
      # and bootstraps its own deps through ezvcpkg on first configure.
      - name: Clone cesium-native (v0.61.0)
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          git clone --branch v0.61.0 --depth 1 --recurse-submodules \
            https://github.com/CesiumGS/cesium-native.git third_party/cesium-native

      - name: Install Android NDK (26.3.11579264) + SDK components
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;26.3.11579264" "platforms;android-35" "build-tools;34.0.0"
          # ezvcpkg's vcpkg arm64-android triplet + the NDK chainload need
          # ANDROID_NDK_HOME (the cpp CMakeLists has a ${ANDROID_NDK} fallback,
          # but export it explicitly so the env path is authoritative).
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"

      # See the CMake 3.31.6 decision note at the top of this file.
      - name: Install CMake 3.31.6 (+ ninja + glslangValidator) for AGP
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          CMAKE_VER=3.31.6
          curl -fsSL -o /tmp/cmake.tar.gz \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VER}/cmake-${CMAKE_VER}-linux-x86_64.tar.gz"
          mkdir -p "$HOME/cmake-dist"
          tar -xzf /tmp/cmake.tar.gz -C "$HOME/cmake-dist" --strip-components=1
          sudo apt-get update
          # ninja: AGP needs it next to cmake (below). glslang-tools: provides
          # glslangValidator, which tiles_common/CMakeLists.txt requires to bake
          # the tile.vert/tile.frag SPIR-V headers (the macOS leg gets it from
          # `brew install glslang`). Vulkan itself comes from the NDK sysroot.
          sudo apt-get install -y ninja-build glslang-tools
          # AGP requires `ninja` next to `cmake` in cmake.dir/bin.
          ln -sf "$(command -v ninja)" "$HOME/cmake-dist/bin/ninja"
          "$HOME/cmake-dist/bin/cmake" --version
          echo "EARTHVIEW_CMAKE_DIR=$HOME/cmake-dist" >> "$GITHUB_ENV"

      - name: Write local.properties (sdk.dir + cmake.dir)
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            echo "cmake.dir=$EARTHVIEW_CMAKE_DIR"
          } > android/local.properties
          cat android/local.properties

      # ezvcpkg cross-builds ~118 vcpkg libs (OpenSSL/curl/draco/KTX/…) for
      # arm64-android on first configure — slow and potentially flaky. Cache the
      # ezvcpkg base dir so subsequent runs skip the dep rebuild.
      - name: Cache ezvcpkg (cesium arm64-android deps)
        if: needs.DetectChanges.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.ezvcpkg
          key: ezvcpkg-arm64-android-${{ hashFiles('android/src/main/cpp/CMakeLists.txt', 'android/build.gradle') }}
          restore-keys: |
            ezvcpkg-arm64-android-

      # Signing is driven entirely by repo secrets — no keystore lives in the repo:
      #   ANDROID_KEYSTORE_BASE64  ANDROID_KEYSTORE_PASSWORD  ANDROID_KEY_ALIAS  ANDROID_KEY_PASSWORD
      # build.gradle reads ANDROID_KEYSTORE_FILE + the passwords from the env. A build
      # with those unset (e.g. a fork) produces an UNSIGNED release APK and skips the
      # attach, so it never fails for want of the key.
      - name: Decode release keystore
        if: needs.DetectChanges.outputs.docs_only != 'true' && env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build :android:assembleRelease
        if: needs.DetectChanges.outputs.docs_only != 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :android:assembleRelease --no-daemon --stacktrace

      # ---- versionCode / versionName gate (#60) ---------------------------
      # Prove the stamps FROM THE ARTIFACT, never from the inputs that were
      # supposed to produce them. Three failures this catches, all of which have
      # shipped somewhere in the org:
      #   * versionCode/versionName hardcoded (1 / "0.1") -- the #60 bug: no
      #     on-device version signal at all, and a version-gated device test
      #     reads "0.1", concludes "old app", and passes green proving nothing.
      #   * EMPTY versionCode from a tagless/shallow clone + a swallowed
      #     exception (runtime#1226). Android then cannot compare versions, so
      #     no installed unit can upgrade in place.
      #   * WRONG base tag: `git describe` without `--tags` sees only ANNOTATED
      #     tags and ours are lightweight (runtime#1379).
      # scripts/android_version_code.py is an independent implementation of the
      # arithmetic in android/build.gradle; comparing the two is the point.
      - name: Verify APK version stamps
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          python3 scripts/android_version_code.py --selftest

          APK=$(find android/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::no release APK found under android/build/outputs/apk/release"
            exit 1
          fi
          AAPT2=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          if [ -z "$AAPT2" ]; then
            echo "::error::no aapt2 under \$ANDROID_HOME/build-tools -- cannot read the APK manifest"
            exit 1
          fi

          badging=$("$AAPT2" dump badging "$APK")
          vcode=$(printf '%s\n' "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -1)
          vname=$(printf '%s\n' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          echo "APK stamps: versionCode='${vcode}' versionName='${vname}'"

          if [ -z "$vcode" ]; then
            echo "::error::APK has an EMPTY versionCode. Android cannot compare versions, so no installed unit can upgrade in place."
            exit 1
          fi
          case "$vcode" in
            ''|*[!0-9]*) echo "::error::versionCode '$vcode' is not a plain integer"; exit 1 ;;
          esac
          if [ "$vcode" -le 1 ]; then
            echo "::error::versionCode $vcode is <= 1, the hardcoded value every shipped demo APK carries (#60). Android refuses downgrades and an in-place upgrade would be ambiguous."
            exit 1
          fi

          describe=$(git describe --tags --long --match 'v[0-9]*')
          want_code=$(python3 scripts/android_version_code.py --describe "$describe" --print code)
          want_name=$(python3 scripts/android_version_code.py --describe "$describe" --print name)
          echo "expected from '$describe': versionCode=$want_code versionName=$want_name"

          if [ "$vcode" != "$want_code" ]; then
            echo "::error::versionCode $vcode does not match the tag arithmetic for '$describe' (expected $want_code). android/build.gradle and scripts/android_version_code.py have diverged."
            exit 1
          fi
          # A dirty CI tree is its own problem; do not let it mask the check.
          if [ "${vname%-dirty}" != "$want_name" ]; then
            echo "::error::versionName '$vname' does not match '$want_name' derived from '$describe'. If it names an older release than the tag you are building, git describe lost --tags."
            exit 1
          fi
          # On a tag build the APK's versionName must EQUAL the tag -- this is the
          # assertion #60 asks for. A `-<n>-g<sha>` suffix here means the tag is
          # not the commit being built, which is just as wrong as naming a
          # different release.
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${vname%-dirty}" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag build of $GITHUB_REF_NAME produced versionName '$vname'. The released APK must name itself after the tag it was built from (#60)."
            exit 1
          fi
          echo "  ok: versionCode=$vcode versionName=$vname (above the shipped 1, matches $describe)"

      - name: Derive version
        if: needs.DetectChanges.outputs.docs_only != 'true'
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.0-dev.${GITHUB_SHA::8}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Built APK with VERSION=$VERSION"

      - name: Stage APK (rename to release artifact name)
        if: needs.DetectChanges.outputs.docs_only != 'true'
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Release APK basename varies (android-release.apk when signed,
          # android-release-unsigned.apk on a keyless fork build), so resolve by glob.
          SRC=$(find android/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$SRC" ] || [ ! -f "$SRC" ]; then
            echo "::error::expected release APK missing under android/build/outputs/apk/release"
            find android/build/outputs -name '*.apk' -type f || true
            exit 1
          fi
          OUT="DisplayXREarthView-${VERSION}-android.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -la "$OUT"

      - name: Upload APK
        if: needs.DetectChanges.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: DisplayXREarthView-Android
          if-no-files-found: error
          path: ${{ steps.apk.outputs.path }}

      # Only when the APK is release-signed (keystore secret present) — never publish
      # an unsigned APK to a release.
      - name: Attach APK to GitHub release on tag
        if: needs.DetectChanges.outputs.docs_only != 'true' && startsWith(github.ref, 'refs/tags/v') && env.ANDROID_KEYSTORE_FILE != ''
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
